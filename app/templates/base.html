<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Automation Platform{% endblock %}
    </title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="app-layout">

<aside class="sidebar">

    <div class="sidebar-brand">
        Automation Platform
    </div>

    <div class="sidebar-user">

    <div class="sidebar-user-name">
        {{ current_user.username }}
    </div>

    <div class="sidebar-user-role">
        {{ current_user.role|capitalize }}
    </div>

</div>

    <nav class="sidebar-nav">

<a
    href="/dashboard"
    class="sidebar-link {% if request.url.path == '/dashboard' %}active{% endif %}"
>
    <span class="sidebar-icon">🏠</span>
    <span>Dashboard</span>
</a>

{% if current_user.role|lower == "admin" %}

<a
    href="/upload-script"
    class="sidebar-link {% if request.url.path == '/upload-script' %}active{% endif %}"
>
    <span class="sidebar-icon">📂</span>
    <span>Upload Script</span>
</a>

{% endif %}

<a
    href="/history"
    class="sidebar-link {% if request.url.path == '/history' %}active{% endif %}"
>
    <span class="sidebar-icon">📜</span>
    <span>Execution History</span>
</a>

    </nav>

    <div class="sidebar-footer">

    <a href="/logout" class="sidebar-link sidebar-logout">
        <span class="sidebar-icon">🚪</span>
        <span>Logout</span>
    </a>

</div>

</aside>        

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>

</html>
